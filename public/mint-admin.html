<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mint Admin - Your Wojak</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #ffffff;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ff6b00, #ff9500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #a0a0b0; margin-bottom: 30px; }

    .auth-box {
      background: #12121a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 30px;
      margin-bottom: 30px;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px;
      background: #1a1a24;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 15px;
    }

    button {
      padding: 12px 24px;
      background: #ff6b00;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover { background: #ff8520; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #12121a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 20px;
    }
    .stat-label { color: #a0a0b0; font-size: 12px; margin-bottom: 5px; text-transform: uppercase; }
    .stat-value { font-size: 32px; font-weight: 700; }
    .stat-value.success { color: #22c55e; }
    .stat-value.warning { color: #ff6b00; }
    .stat-value.danger { color: #ef4444; }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .tab {
      padding: 10px 20px;
      background: transparent;
      border: none;
      color: #a0a0b0;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      transition: all 0.2s;
    }
    .tab.active {
      background: #ff6b00;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #12121a;
      border-radius: 14px;
      overflow: hidden;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    th {
      background: #1a1a24;
      color: #a0a0b0;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-minted { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    .status-pending { background: rgba(255, 107, 0, 0.2); color: #ff6b00; }
    .status-failed { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .status-expired { background: rgba(160, 160, 176, 0.2); color: #a0a0b0; }

    .action-btn {
      padding: 6px 12px;
      font-size: 12px;
      margin-right: 5px;
    }

    .hidden { display: none; }

    .wallet { font-family: monospace; font-size: 12px; color: #00d4ff; }

    .download-section {
      margin-bottom: 30px;
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Mint Admin Dashboard</h1>
    <p class="subtitle">Audit trail and refund management for Your Wojak minting</p>

    <div id="authBox" class="auth-box">
      <h3 style="margin-bottom: 15px;">Admin Authentication Required</h3>
      <input type="password" id="adminSecret" placeholder="Enter ADMIN_SECRET">
      <button onclick="authenticate()">Unlock Dashboard</button>
    </div>

    <div id="dashboard" class="hidden">
      <div class="download-section">
        <button onclick="downloadJSON()">📥 Download JSON</button>
        <button onclick="downloadCSV()">📊 Download CSV</button>
        <button onclick="refreshData()">🔄 Refresh Data</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="tabs">
        <button class="tab active" onclick="showTab('all')">All Mints</button>
        <button class="tab" onclick="showTab('needs_refund')">Needs Refund</button>
        <button class="tab" onclick="showTab('pending')">Pending</button>
        <button class="tab" onclick="showTab('failed')">Failed</button>
      </div>

      <div id="tableContainer"></div>
    </div>
  </div>

  <script>
    let adminSecret = '';
    let auditData = null;
    let currentTab = 'all';

    function authenticate() {
      adminSecret = document.getElementById('adminSecret').value;
      if (!adminSecret) {
        alert('Please enter admin secret');
        return;
      }
      loadData();
    }

    async function loadData() {
      try {
        const response = await fetch('/api/mint/audit', {
          headers: { 'Authorization': `Bearer ${adminSecret}` }
        });

        if (response.status === 401) {
          alert('Invalid admin secret');
          return;
        }

        if (!response.ok) {
          throw new Error('Failed to load data');
        }

        auditData = await response.json();

        document.getElementById('authBox').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');

        renderStats();
        renderTable();
      } catch (error) {
        alert('Error loading data: ' + error.message);
      }
    }

    function renderStats() {
      const { summary } = auditData;
      document.getElementById('stats').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Total Mints</div>
          <div class="stat-value">${summary.total_mints}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Successful</div>
          <div class="stat-value success">${summary.minted}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending</div>
          <div class="stat-value warning">${summary.pending}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Needs Refund</div>
          <div class="stat-value danger">${summary.needs_refund}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Failed</div>
          <div class="stat-value">${summary.failed}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Free Mints</div>
          <div class="stat-value">${summary.free_mints}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Paid Mints</div>
          <div class="stat-value">${summary.paid_mints}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Refunds Issued</div>
          <div class="stat-value success">${summary.refunds_issued}</div>
        </div>
      `;
    }

    function renderTable() {
      const data = currentTab === 'all' ? auditData.all_mints : auditData.categories[currentTab] || [];

      const rows = data.map(m => `
        <tr>
          <td>${m.id}</td>
          <td>${m.mint_number || '-'}</td>
          <td class="wallet">${m.wallet_address.substring(0, 12)}...</td>
          <td><span class="status-badge status-${m.status}">${m.status}</span></td>
          <td>${m.mint_type}</td>
          <td>${new Date(m.created_at).toLocaleString()}</td>
          <td>${m.mintgarden_launcher_id ? '✅' : '❌'}</td>
          <td>${m.error_message || '-'}</td>
          <td>${m.refund_needed ? '⚠️' : '✅'}</td>
          <td>
            ${!m.refund_needed && m.status === 'failed' ?
              `<button class="action-btn" onclick="markRefund(${m.id})">Mark Refund</button>` :
              ''}
            ${m.refund_needed && !m.refund_issued ?
              `<button class="action-btn" onclick="issueRefund(${m.id})">Issue Refund</button>` :
              ''}
            ${m.refund_issued ? '✅ Issued' : ''}
          </td>
        </tr>
      `).join('');

      document.getElementById('tableContainer').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Mint#</th>
              <th>Wallet</th>
              <th>Status</th>
              <th>Type</th>
              <th>Created</th>
              <th>NFT</th>
              <th>Error</th>
              <th>Refund</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      renderTable();
    }

    async function markRefund(mintId) {
      const reason = prompt('Enter refund reason:');
      if (!reason) return;

      try {
        const response = await fetch('/api/mint/refund', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${adminSecret}`
          },
          body: JSON.stringify({ action: 'mark', mintId, reason })
        });

        if (response.ok) {
          alert('Refund marked successfully');
          loadData();
        } else {
          alert('Failed to mark refund');
        }
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    async function issueRefund(mintId) {
      const txid = prompt('Enter Chia transaction ID of the refund:');
      if (!txid) return;

      const notes = prompt('Optional notes:') || '';

      try {
        const response = await fetch('/api/mint/refund', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${adminSecret}`
          },
          body: JSON.stringify({ action: 'issue', mintId, txid, notes })
        });

        if (response.ok) {
          alert('Refund recorded successfully');
          loadData();
        } else {
          alert('Failed to record refund');
        }
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    function downloadJSON() {
      const dataStr = JSON.stringify(auditData, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `mint-audit-${new Date().toISOString().split('T')[0]}.json`;
      link.click();
    }

    async function downloadCSV() {
      const response = await fetch('/api/mint/audit?format=csv', {
        headers: { 'Authorization': `Bearer ${adminSecret}` }
      });
      const csv = await response.text();
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `mint-audit-${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }

    function refreshData() {
      loadData();
    }
  </script>
</body>
</html>
