[databases]
; Database connection strings
; Format: dbname = host=hostname port=5432 dbname=actual_db user=username password=pwd
wojak_prod = host=wprojekt-db.c0xgabz6x1zc.us-east-1.rds.amazonaws.com port=5432 dbname=wojak_prod
wojak_dev = host=localhost port=5432 dbname=wojak_dev
wojak_staging = host=wprojekt-staging-db.c0xgabz6x1zc.us-east-1.rds.amazonaws.com port=5432 dbname=wojak_staging

[pgbouncer]
; NETWORKING
host = 0.0.0.0
port = 6432
listen_backlog = 1024

; AUTHENTICATION
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; SECURITY
ssl = off
; ssl_key_file = /etc/pgbouncer/key.pem
; ssl_cert_file = /etc/pgbouncer/cert.pem

; POOL SIZING
; In transaction pooling: connection is returned immediately after query
pool_mode = transaction
; In session pooling: connection returned when client disconnects
; pool_mode = session

; Maximum connections from clients
max_client_conn = 1000

; Minimum connections to database
min_pool_size = 10

; Default pool size (per database)
default_pool_size = 25

; Reserve pool size (when pool exhausted)
reserve_pool_size = 5
reserve_pool_timeout = 3

; Server connection lifetime (seconds)
server_lifetime = 3600

; Server idle timeout (seconds, disconnect idle connections)
server_idle_timeout = 600

; Connection check timeout (seconds)
connect_timeout = 15

; Query timeout
query_timeout = 0

; Max database connections
max_db_connections = 100
max_user_connections = 50

; CONNECTION HANDLING
; Reuse previously used connection if available
connection_age_limit = 3600

; Idle connection reaping
idle_in_transaction_session_timeout = 0

; STATS & MONITORING
; Log connections and disconnections
log_connections = 1
log_disconnections = 1
log_pooler_error = 1
log_statements = 0

; Enable stats API
stats_users = stats_collector
enable_stats_api = 1

; ADMIN INTERFACE
admin_users = admin

; TIMEOUTS
server_connect_timeout = 15
server_check_delay = 30
server_check_query = "SELECT 1"
server_fast_close = 0

; PERFORMANCE
; Number of backends to send to same database server
server_round_robin = 1

; Enable verbose logging (for debugging)
verbose = 0
