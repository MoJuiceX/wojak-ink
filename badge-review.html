<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wojak Merge — Badge NFT Review</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 8px;
    font-size: 28px;
  }
  .instructions {
    text-align: center;
    color: rgba(255,255,255,0.5);
    margin-bottom: 24px;
    font-size: 14px;
    line-height: 1.5;
  }
  .category {
    margin-bottom: 40px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
  }
  .category-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    cursor: pointer;
    user-select: none;
  }
  .category-header:hover {
    background: rgba(255,255,255,0.03);
  }
  .category-title {
    font-size: 20px;
    font-weight: 700;
  }
  .category-meta {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
  }
  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    padding: 16px;
    background: rgba(0,0,0,0.3);
  }
  .nft-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    transition: border-color 0.2s, opacity 0.2s;
    cursor: pointer;
  }
  .nft-card:hover {

  }
  .nft-card.excluded {

  }
  .nft-card.excluded .nft-label {
    text-decoration: line-through;
    color: rgba(239, 68, 68, 0.7);
  }
  .nft-img {
    width: 90px;
    height: 90px;
    border-radius: 6px;
    object-fit: cover;
    background: #1a1a2e;
  }
  .nft-label {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);

  .cat-RoyalClub .category-header { border-left: 4px solid #4ade80; }
  .cat-Pirate .category-header { border-left: 4px solid #4ade80; }
  .cat-SuperSaiyan .category-header { border-left: 4px solid #f59e0b; }
  .cat-Hellspawn .category-header { border-left: 4px solid #f59e0b; }
  .cat-Ronin .category-header { border-left: 4px solid #8b5cf6; }
  .cat-Neckbeard .category-header { border-left: 4px solid #8b5cf6; }
  .cat-HonkGang .category-header { border-left: 4px solid #ec4899; }
  .cat-Namekian .category-header { border-left: 4px solid #10b981; }

  .cat-Phunky .category-title { color: rgba(255,255,255,0.7); }
  .cat-HighCouncil .category-title { color: rgba(255,255,255,0.7); }
  .cat-BepeArmy .category-title { color: rgba(255,255,255,0.7); }
  .cat-RoyalClub .category-title { color: #4ade80; }
  .cat-Pirate .category-title { color: #4ade80; }
  .cat-SuperSaiyan .category-title { color: #f59e0b; }
  .cat-Hellspawn .category-title { color: #f59e0b; }

  .export-bar {

    top: 0;
    z-index: 100;
    background: #12121a;

    font-weight: 600;
    cursor: pointer;

    border-color: #10b981;
    color: #000;
  }
  .export-btn.primary:hover { background: #0d9668; }

  /* Output modal */
  .output-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,0.8);
    align-items: center;
    justify-content: center;
  }
  .output-overlay.visible { display: flex; }
  .output-box {
    background: #1a1a2e;
    border-radius: 12px;
    padding: 24px;
    max-width: 700px;
    width: 90%;
    max-height: 80vh;
    overflow: auto;
  }
  .output-box h3 { margin-bottom: 12px; }
  .output-box textarea {
    width: 100%;
    height: 300px;
    background: #0a0a0f;
    color: #4ade80;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 12px;
    font-family: monospace;
    font-size: 12px;
    resize: vertical;
  }
  .output-box button {
    margin-top: 12px;
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    background: #10b981;
    color: #000;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>

<div class="export-bar">

</div>

const RARITY = {
  "Phunky": "Common",
  "High Council": "Common",
  "Bepe Army": "Common",
  "Royal Club": "Uncommon",
  "Pirate": "Uncommon",
  "Super Saiyan": "Rare",
  "Hellspawn": "Rare",
  "Ronin": "Epic",
  "Neckbeard": "Epic",
  "Honk Gang": "Legendary",
  "Namekian": "Ultra Legendary"
};

const TILE_VALUES = {
  "Phunky": 2,
  "High Council": 4,
  "Bepe Army": 8,
  "Royal Club": 16,
  "Pirate": 32,
  "Super Saiyan": 64,
  "Hellspawn": 128,
  "Ronin": 256,
  "Neckbeard": 512,
  "Honk Gang": 1024,
  "Namekian": 2048
};

// Track excluded NFTs per category
const excluded = {};
for (const cat of Object.keys(BADGE_DATA)) excluded[cat] = new Set();

function getNftUrl(id) {
  return `${IPFS_BASE}/${String(id).padStart(4, '0')}.png`;
}

function cssClass(name) {
  return name.replace(/\s+/g, '');
}

function updateCount() {
  let total = 0;
  for (const s of Object.values(excluded)) total += s.size;
  document.getElementById('excludeCount').textContent = total;
}

function toggleNft(category, id, card) {
  if (excluded[category].has(id)) {
    excluded[category].delete(id);
    card.classList.remove('excluded');
  } else {
    excluded[category].add(id);
    card.classList.add('excluded');
  }
  updateCount();
  // Update category count
  const header = card.closest('.category').querySelector('.cat-count');
  const total = BADGE_DATA[category].length;
  const ex = excluded[category].size;
  header.textContent = `${total - ex} / ${total} NFTs — ${RARITY[category]} — Tile ${TILE_VALUES[category]}`;
}

function render() {
  const container = document.getElementById('categories');
  for (const [category, ids] of Object.entries(BADGE_DATA)) {
    const section = document.createElement('div');
    section.className = `category cat-${cssClass(category)}`;

    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `
      <span class="category-title">${category}</span>
      <span class="category-meta cat-count">${ids.length} / ${ids.length} NFTs — ${RARITY[category]} — Tile ${TILE_VALUES[category]}</span>
    `;

    const grid = document.createElement('div');
    grid.className = 'category-grid';

    for (const id of ids) {
      const card = document.createElement('div');
      card.className = 'nft-card';
      card.onclick = () => toggleNft(category, id, card);
      card.innerHTML = `
        <img class="nft-img" src="${getNftUrl(id)}" alt="#${id}" loading="lazy" />
        <span class="nft-label">#${id}</span>
      `;
      grid.appendChild(card);
    }

    section.appendChild(header);
    section.appendChild(grid);
    container.appendChild(section);
  }
}

function clearAll() {
  for (const s of Object.values(excluded)) s.clear();
  document.querySelectorAll('.nft-card.excluded').forEach(c => c.classList.remove('excluded'));
  updateCount();
  // Reset all counts
  document.querySelectorAll('.cat-count').forEach(el => {
    const cat = el.closest('.category');
    const catName = cat.querySelector('.category-title').textContent;
    el.textContent = `${BADGE_DATA[catName].length} / ${BADGE_DATA[catName].length} NFTs — ${RARITY[catName]} — Tile ${TILE_VALUES[catName]}`;
  });
}

function exportExcluded() {
  const lines = [];
  lines.push('Excluded NFTs per category:');
  lines.push('');
  for (const [cat, ids] of Object.entries(excluded)) {
    if (ids.size === 0) continue;
    const sorted = [...ids].sort((a, b) => a - b);
    lines.push(`${cat} (remove ${ids.size}): ${sorted.join(', ')}`);
  }
  if (lines.length === 2) {
    lines.push('(none excluded)');
  }
  document.getElementById('outputText').value = lines.join('\n');
  document.getElementById('outputOverlay').classList.add('visible');
}

function closeOutput(e) {
  if (e.target === document.getElementById('outputOverlay')) {
    document.getElementById('outputOverlay').classList.remove('visible');
  }
}

function copyOutput() {
  const ta = document.getElementById('outputText');
  ta.select();
  navigator.clipboard.writeText(ta.value);
}

render();
</script>
