# Cloudflare Pages Configuration for Wojak.ink
# This configures Pages Functions with D1 database binding

name = "wojak-ink"
compatibility_date = "2024-01-01"

# Required for Pages - specifies the build output directory
pages_build_output_dir = "dist"

# D1 Database binding for user profiles, leaderboards, etc.
[[d1_databases]]
binding = "DB"
database_name = "wojak-users"
database_id = "32e7fa5f-524e-4913-b541-f9a339c126c6"

# KV Namespace binding for trade values cache
[[kv_namespaces]]
binding = "TRADE_VALUES_KV"
id = "3d3382d37eeb4d4dac250fcf03b3f24d"

# KV Namespace for mint job image storage (30 min TTL)
[[kv_namespaces]]
binding = "MINT_JOBS_KV"
id = "ccfd834158b44a799fe567fe0e3c26cf"

# Environment variables
[vars]
COLLECTION_ID = "col10hfq4hml2z0z0wutu3a9hvt60qy9fcq4k4dznsfncey4lu6kpt3su7u9ah"
SECONDARY_SALES_CUTOFF = "2025-12-20T00:00:00Z"

# Phase 2: Your Wojak — Minting config
PHASE2_COLLECTION_UUID = "010a0dd7-56af-4016-953e-ef5e20c73d83"
PHASE2_PROFILE_ID = "did:chia:15j5d0fm0x65nz7w6jr4c5any8mzrkru2x6l9uy2f0vcrc6jfedcqp20n4q"
PHASE2_ROYALTY_ADDRESS = "DYNAMIC_PER_MINTER"  # split: 10% minter + 2% treasury via SplitXCH
TREASURY_ADDRESS = "xch13afmxv0xpyz03t3jfdmcrtv5ecwe5n52977vxd3z2x995f9quunsre5vkd"
# CREATOR_PAYOUT_ADDRESS: set in Cloudflare Dashboard (Variables) only — do not add here or deploy fails (binding already in use). For local dev use .dev.vars.
PHASE2_ROYALTY_PCT = "12"
PINATA_GATEWAY = "gold-important-gibbon-467.mypinata.cloud"

# Secrets (set via `wrangler pages secret put --project-name=wojak-ink` or Cloudflare Dashboard):
# - CLERK_DOMAIN: Your Clerk domain (e.g., your-app.clerk.accounts.dev)
# - CHAT_JWT_SECRET: Secret for signing chat tokens (generate with: openssl rand -base64 32)
# - PINATA_JWT: Pinata API JWT for IPFS uploads (already set)
# - MINTGARDEN_API_KEY: MintGarden Dynamic Minting API key (run: wrangler pages secret put MINTGARDEN_API_KEY)
# - CREATOR_PAYOUT_ADDRESS: set in Dashboard Variables (paid-mint XCH recipient). If unset, code uses TREASURY_ADDRESS.
