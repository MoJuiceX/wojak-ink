name: Terraform CI/CD

on:
  push:
    branches: [main, dev]
    paths: ['terraform/**']
  pull_request:
    branches: [main, dev]
    paths: ['terraform/**']

env:
  TF_VERSION: 1.5.0

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check -recursive
        continue-on-error: true
      
      - name: Terraform Init
        run: terraform -chdir=terraform init -upgrade
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      - name: Terraform Validate
        run: terraform -chdir=terraform validate
      
      - name: Terraform Plan (Dev)
        if: github.ref != 'refs/heads/main'
        run: terraform -chdir=terraform plan -var-file=environments/dev.tfvars -out=tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_database_replica_url: ${{ secrets.DATABASE_REPLICA_URL }}
      
      - name: Terraform Plan (Prod)
        if: github.ref == 'refs/heads/main'
        run: terraform -chdir=terraform plan -var-file=environments/prod.tfvars -out=tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL_PROD }}
          TF_VAR_database_replica_url: ${{ secrets.DATABASE_REPLICA_URL_PROD }}
      
      - name: Terraform Apply (Main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform -chdir=terraform apply -auto-approve tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL_PROD }}
          TF_VAR_database_replica_url: ${{ secrets.DATABASE_REPLICA_URL_PROD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      - name: Export Terraform Outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform -chdir=terraform output -json > terraform-outputs.json
      
      - name: Upload Outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: terraform-outputs.json
