name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (scoped)
        run: npm run lint:scoped
      - name: Unit Tests
        run: npm run test:unit
      - name: Build
        run: npm run build
        env:
          VITE_LAYER_BASE_URL: https://layers.wojak.ink
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_PARSE_APP_ID: ${{ secrets.VITE_PARSE_APP_ID }}
          VITE_PARSE_JS_KEY: ${{ secrets.VITE_PARSE_JS_KEY }}
          VITE_PARSE_SERVER_URL: ${{ secrets.VITE_PARSE_SERVER_URL }}
      - name: Bundle Budget Report
        run: npm run bundle:report -- --enforce-hard --json-out=reports/bundle-budget-ci.json --md-out=reports/bundle-budget-ci.md
      - name: Upload bundle budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-budget-report
          if-no-files-found: ignore
          path: |
            reports/bundle-budget-ci.json
            reports/bundle-budget-ci.md
