name: Health Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health-monitor-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  monitor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
          - environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.environment }}
    steps:
      - name: Probe /api/health
        id: probe
        continue-on-error: true
        env:
          HEALTH_URL: ${{ secrets.CANARY_HEALTHCHECK_URL }}
          TARGET_ENV: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          test -n "${HEALTH_URL:-}" || { echo "Missing CANARY_HEALTHCHECK_URL secret for ${TARGET_ENV}" >&2; exit 1; }
          code=$(mktemp)
          body=$(mktemp)
          curl -sS -o "$body" -w '%{http_code}' "$HEALTH_URL" > "$code"
          http_code=$(cat "$code")
          echo "http_code=$http_code" >> "$GITHUB_OUTPUT"
          echo "body_path=$body" >> "$GITHUB_OUTPUT"
          status=$(jq -r '.status // empty' "$body" 2>/dev/null || true)
          echo "health_status=$status" >> "$GITHUB_OUTPUT"
          cat "$body"
          if [ "$http_code" != "200" ] && [ "$http_code" != "206" ]; then
            echo "Unexpected HTTP status: $http_code" >&2
            exit 1
          fi
          if [ "$status" != "healthy" ] && [ "$status" != "degraded" ]; then
            echo "Unexpected health status payload: ${status:-<empty>}" >&2
            exit 1
          fi

      - name: Create/update incident issue on failure
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          TARGET_ENV: ${{ matrix.environment }}
          HEALTH_URL: ${{ secrets.CANARY_HEALTHCHECK_URL }}
          HTTP_CODE: ${{ steps.probe.outputs.http_code }}
          HEALTH_STATUS: ${{ steps.probe.outputs.health_status }}
        with:
          script: |
            const env = process.env.TARGET_ENV;
            const title = `🚨 Health monitor failure (${env})`;
            const labelNames = ['incident', 'health-monitor'];
            const { data: labels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existingLabels = new Set(labels.map(l => l.name));
            for (const name of labelNames) {
              if (!existingLabels.has(name)) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color: name === 'incident' ? 'd73a4a' : 'fbca04',
                }).catch(() => {});
              }
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident,health-monitor',
              per_page: 100,
            });
            const existing = issues.find(i => i.title === title);
            const body = [
              `Health monitor detected a failing /api/health probe.`,
              '',
              `- Environment: ${env}`,
              `- URL: ${process.env.HEALTH_URL || '(missing secret)'}`,
              `- HTTP code: ${process.env.HTTP_CODE || 'unknown'}`,
              `- Payload status: ${process.env.HEALTH_STATUS || 'unknown'}`,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              `Investigate and resolve before shipping further changes.`
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: labelNames,
              });
            }

      - name: Fail job when probe failed
        if: steps.probe.outcome == 'failure'
        run: exit 1
