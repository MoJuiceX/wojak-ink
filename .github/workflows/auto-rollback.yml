name: Auto Rollback on Failure

on:
  schedule:
    # GitHub Actions supports a minimum 5-minute schedule interval.
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: [Canary Deployment]
    types: [completed]

jobs:
  monitor-and-rollback:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Check deployment status
        run: |
          echo "🔍 Checking deployment status..."
          STATUS=$(kubectl get rollout/wojak-ink-api -n default -o jsonpath='{.status.phase}')
          echo "Status: $STATUS"
      
      - name: Fetch error metrics from Prometheus
        id: metrics
        run: |
          # Query Prometheus for error rate
          ERROR_RATE=$(curl -s 'http://prometheus:9090/api/v1/query' \
            --data-urlencode 'query=rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])' | \
            jq '.data.result[0].value[1]' || echo "0")
          
          echo "error_rate=$ERROR_RATE" >> $GITHUB_OUTPUT
          
          echo "Error rate: ${ERROR_RATE}%"
          
          # Trigger rollback if error rate > 0.5%
          if (( $(echo "$ERROR_RATE > 0.005" | bc -l) )); then
            echo "should_rollback=true" >> $GITHUB_OUTPUT
          else
            echo "should_rollback=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Check database connectivity
        id: db_check
        run: |
          # Test database connection
          DB_OK=$(curl -s https://api.wojak-ink.com/api/health | jq '.database.primary' || echo "false")
          echo "database_ok=$DB_OK" >> $GITHUB_OUTPUT
          
          if [ "$DB_OK" != "true" ]; then
            echo "should_rollback=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Check Redis connectivity
        id: redis_check
        run: |
          # Test Redis connection
          REDIS_OK=$(curl -s https://api.wojak-ink.com/api/health | jq '.cache.redis' || echo "false")
          echo "redis_ok=$REDIS_OK" >> $GITHUB_OUTPUT
          
          if [ "$REDIS_OK" != "true" ]; then
            echo "should_rollback=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Rollback deployment
        if: steps.metrics.outputs.should_rollback == 'true'
        run: |
          echo "🔄 Rolling back deployment..."
          
          # Undo the last rollout
          kubectl rollout undo rollout/wojak-ink-api -n default
          
          # Wait for rollback to complete
          kubectl rollout status rollout/wojak-ink-api -n default --timeout=10m
          
          echo "✅ Rollback complete"
      
      - name: Verify rollback
        if: steps.metrics.outputs.should_rollback == 'true'
        run: |
          echo "🔍 Verifying rollback..."
          
          sleep 30
          
          # Check if deployment is healthy
          HEALTH=$(curl -s -w "%{http_code}" -o /dev/null https://api.wojak-ink.com/api/health)
          
          if [ "$HEALTH" -eq 200 ]; then
            echo "✅ Rollback verified - deployment is healthy"
          else
            echo "⚠️ Rollback may have failed - health check returned HTTP $HEALTH"
            exit 1
          fi
      
      - name: Notify Slack - Rollback Triggered
        if: steps.metrics.outputs.should_rollback == 'true'
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "⚠️ Automatic Rollback Triggered",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Automatic Rollback* ⚠️\n*Reason:* High error rate or connectivity issue\n*Error Rate:* ${{ steps.metrics.outputs.error_rate }}\n*Database:* ${{ steps.db_check.outputs.database_ok }}\n*Redis:* ${{ steps.redis_check.outputs.redis_ok }}\n\nDeployment has been rolled back to previous stable version."
                  }
                }
              ]
            }
      
      - name: Create incident
        if: steps.metrics.outputs.should_rollback == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Automatic Rollback: Deployment Failed',
              body: `Deployment was automatically rolled back due to high error rate or connectivity issues.

**Metrics:**
- Error Rate: ${{ steps.metrics.outputs.error_rate }}
- Database: ${{ steps.db_check.outputs.database_ok }}
- Redis: ${{ steps.redis_check.outputs.redis_ok }}

**Action:** Manual investigation required.`,
              labels: ['incident', 'deployment']
            })

  check-scheduled:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Check health every minute during business hours
        run: |
          # This job runs every 5 minutes and checks health
          # Only alerts if issues detected
          echo "🔍 Periodic health check..."
          
          HEALTH=$(curl -s -w "%{http_code}" -o /dev/null https://api.wojak-ink.com/api/health)
          
          if [ "$HEALTH" -ne 200 ]; then
            echo "⚠️ Deployment unhealthy (HTTP $HEALTH)"
            exit 1
          fi
          
          echo "✅ Health check passed"
