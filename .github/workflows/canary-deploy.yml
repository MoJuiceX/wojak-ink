name: Canary Deployment

on:
  workflow_dispatch:
    inputs:
      percentage:
        description: 'Traffic percentage (5, 25, 50, 100)'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '25'
          - '50'
          - '100'
  push:
    branches: [main]
    paths: ['src/**', 'functions/**', 'package.json']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.27.0'
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Check current deployment
        run: |
          kubectl get deployments -n default
          kubectl get rollouts -n default
      
      - name: Deploy canary (5% traffic)
        if: github.event.inputs.percentage == '5' || github.event_name == 'push'
        run: |
          kubectl set image rollout/wojak-ink-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n default \
            --record
          
          echo "⏳ Waiting for rollout to become ready..."
          kubectl rollout status rollout/wojak-ink-api -n default --timeout=10m
      
      - name: Increase traffic to 25%
        if: github.event.inputs.percentage == '25'
        run: |
          kubectl set image rollout/wojak-ink-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n default
          kubectl wait --for=condition=Progressing=True rollout/wojak-ink-api -n default --timeout=5m
      
      - name: Increase traffic to 50%
        if: github.event.inputs.percentage == '50'
        run: |
          kubectl set image rollout/wojak-ink-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n default
          kubectl wait --for=condition=Progressing=True rollout/wojak-ink-api -n default --timeout=5m
      
      - name: Complete rollout (100%)
        if: github.event.inputs.percentage == '100'
        run: |
          kubectl set image rollout/wojak-ink-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n default
          kubectl wait --for=condition=Progressing=True rollout/wojak-ink-api -n default --timeout=5m
      
      - name: Wait and monitor
        run: |
          echo "⏳ Monitoring canary deployment for 5 minutes..."
          sleep 300
      
      - name: Check health
        run: |
          for i in {1..3}; do
            echo "Health check $i/3..."
            HEALTH=$(curl -s -w "%{http_code}" -o /dev/null https://api.wojak-ink.com/api/health)
            
            if [ "$HEALTH" -eq 200 ]; then
              echo "✅ Health check passed"
              exit 0
            else
              echo "⚠️ Health check failed (HTTP $HEALTH)"
              sleep 30
            fi
          done
          
          echo "❌ Health check failed after 3 attempts"
          exit 1
      
      - name: Check error rate
        run: |
          ERROR_COUNT=$(curl -s https://sentry.io/api/0/projects/org/project/stats/ \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" | jq '.stat.total' || echo "0")
          
          echo "Error count in last 5 minutes: $ERROR_COUNT"
          
          if [ "$ERROR_COUNT" -gt 50 ]; then
            echo "❌ Error rate too high"
            exit 1
          fi
          
          echo "✅ Error rate acceptable"
      
      - name: Notify Slack - Success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Canary deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Successful* 🚀\n*Traffic:* ${{ github.event.inputs.percentage || '5' }}%\n*Commit:* ${{ github.sha }}\n*Branch:* ${{ github.ref_name }}"
                  }
                }
              ]
            }
      
      - name: Notify Slack - Failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Canary deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed* ❌\n*Commit:* ${{ github.sha }}\n*View:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
                  }
                }
              ]
            }
