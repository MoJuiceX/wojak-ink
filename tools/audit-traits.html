<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f; color: #e0e0e8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px; line-height: 1.5;
  }
  h1 { font-size: 1.75rem; margin-bottom: 8px; color: #fff; }
  .subtitle { color: #808090; margin-bottom: 24px; font-size: 0.95rem; }

  /* Stats bar */
  .stats {
    display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 32px;
    padding: 16px 20px; background: #12121a; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
  }
  .stat { display: flex; flex-direction: column; }
  .stat-value { font-size: 1.5rem; font-weight: 700; color: #fff; }
  .stat-label { font-size: 0.75rem; color: #808090; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value.ok { color: #22c55e; }
  .stat-value.warn { color: #f97316; }
  .stat-value.error { color: #ef4444; }

  /* Filter */
  .filter-bar {
    display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; align-items: center;
  }
  .filter-btn {
    padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    background: transparent; color: #a0a0b0; cursor: pointer; font-size: 0.85rem;
    transition: all 0.15s;
  }
  .filter-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .filter-btn.active { background: rgba(249,115,22,0.15); border-color: rgba(249,115,22,0.3); color: #f97316; }
  .filter-label { color: #808090; font-size: 0.85rem; margin-right: 4px; }

  /* Category section */
  .category {
    margin-bottom: 40px;
  }
  .category-header {
    font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 4px;
    padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 12px;
  }
  .category-badge {
    font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.06); color: #a0a0b0;
  }
  .category-source {
    font-size: 0.75rem; color: #606070; margin-bottom: 16px;
  }

  /* Trait grid */
  .trait-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .trait-card {
    background: #12121a; border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; overflow: hidden; transition: border-color 0.2s;
  }
  .trait-card:hover { border-color: rgba(255,255,255,0.15); }
  .trait-card.fallback { border-color: rgba(239,68,68,0.4); }
  .trait-card.fallback:hover { border-color: rgba(239,68,68,0.6); }

  .trait-img-wrap {
    width: 100%; aspect-ratio: 1; background: #1a1a2e; display: flex;
    align-items: center; justify-content: center; position: relative; overflow: hidden;
  }
  .trait-img-wrap img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    image-rendering: pixelated;
  }
  .trait-img-wrap .img-error {
    color: #606070; font-size: 0.75rem; text-align: center; padding: 12px;
  }
  .trait-source-tag {
    position: absolute; top: 6px; right: 6px; font-size: 0.65rem; font-weight: 700;
    padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
  }
  .trait-source-tag.g1 { background: rgba(34,197,94,0.2); color: #22c55e; }
  .trait-source-tag.g2 { background: rgba(0,212,255,0.2); color: #00d4ff; }

  .trait-info {
    padding: 10px 12px;
  }
  .trait-meta-name {
    font-size: 0.95rem; font-weight: 600; color: #fff; margin-bottom: 2px;
    word-break: break-word;
  }
  .trait-meta-name.fallback-name { color: #ef4444; }
  .trait-raw-key {
    font-size: 0.7rem; color: #606070; font-family: monospace;
    word-break: break-all; margin-bottom: 4px;
  }
  .trait-status {
    font-size: 0.7rem; font-weight: 600; display: inline-block;
    padding: 1px 6px; border-radius: 4px;
  }
  .trait-status.mapped { background: rgba(34,197,94,0.15); color: #22c55e; }
  .trait-status.fallback-status { background: rgba(239,68,68,0.15); color: #ef4444; }
  .trait-status.override { background: rgba(249,115,22,0.15); color: #f97316; }

  /* Color swatch for solid backgrounds */
  .color-swatch {
    width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  }
  .color-swatch span {
    font-size: 0.7rem; font-family: monospace; color: rgba(0,0,0,0.6);
    background: rgba(255,255,255,0.3); padding: 2px 6px; border-radius: 4px;
  }
</style>

// ============================================================
// Key derivation — mirrors cleanDisplayName() from traitOptions.ts
// ============================================================
function extractNormalized(filename) {
  let cleaned = filename.split('/').pop().replace(/\.(png|jpg|jpeg|gif|webp)$/i, '');
  cleaned = cleaned.replace(/^[A-Z]+_/, '');
  cleaned = cleaned.replace(/^MOUTH_/i, '');
  cleaned = cleaned.replace(/^Base-Wojak[_\s]*/i, '');
  cleaned = cleaned.replace(/[-_]/g, ' ');
  cleaned = cleaned.replace(/^Extra\s*Mouth\s*/i, '');
  cleaned = cleaned.replace(/^Mouth\s*/i, '');
  cleaned = cleaned.replace(/[\u0192\u00C7\u00D6\u2019]/g, "'");
  return cleaned.trim().toLowerCase();
}

function extractNormalizedG2(traitName) {
  return traitName.replace(/[-_]/g, ' ').trim().toLowerCase();
}

function lookupTraitName(rawId) {
  return TRAIT_NAME_MAP[rawId.toLowerCase().trim()] || null;
}

function resolveTraitValue(rawId, layerKey) {
  if (layerKey) {
    const overrideKey = layerKey + ':' + rawId.toLowerCase().trim();
    if (LAYER_OVERRIDES[overrideKey]) return { value: LAYER_OVERRIDES[overrideKey], source: 'override' };
  }
  const mapped = lookupTraitName(rawId);
  if (mapped) return { value: mapped, source: 'map' };
  // Fallback: title-case
  const display = rawId.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  return { value: display, source: 'fallback' };
}

// ============================================================
// Build & render
// ============================================================
const allResults = []; // { category, file, rawKey, metaName, status, layerKey, sourceTag }

function processG1() {
  for (const [category, data] of Object.entries(G1_LAYERS)) {
    for (const file of data.files) {
      const rawKey = extractNormalized(file);
      const resolved = resolveTraitValue(rawKey, data.layerKey);
      allResults.push({
        category,
        imgSrc: file,
        imgType: 'g1',
        rawKey,
        metaName: resolved.value,
        status: resolved.source, // 'map', 'override', 'fallback'
        layerKey: data.layerKey,
      });
    }
  }
}

async function processG2() {
  try {
    const res = await fetch('/assets/wojak-layers/YourWojak-layers/manifest.json');
    const manifest = await res.json();
    const basePath = manifest.basePath;

    // Map G2 categories to metadata trait_type
    const G2_CAT_TO_META = {
      'Clothes': 'Clothes',
      'Face-wear': 'Face Wear',
      'Face-laser': 'Face Wear',
      'Head': 'Head',
      'Mask': 'Mouth',
      'Mouth': 'Mouth',
    };
    const G2_CAT_TO_LAYER = {
      'Clothes': 'Clothes',
      'Face-wear': 'Eyes',
      'Face-laser': 'Eyes',
      'Head': 'Head',
      'Mask': 'Mask',
      'Mouth': 'MouthBase',
    };

    for (const trait of manifest.traits) {
      const rawKey = extractNormalizedG2(trait.name);
      const layerKey = G2_CAT_TO_LAYER[trait.category] || trait.category;
      const resolved = resolveTraitValue(rawKey, layerKey);
      const metaCategory = G2_CAT_TO_META[trait.category] || trait.category;

      // Find best preview image — G2 files are flat in basePath, not in subdirs
      let imgSrc = null;
      if (trait.defaultFile) imgSrc = basePath + '/' + trait.defaultFile;
      else if (trait.fillFile) imgSrc = basePath + '/' + trait.fillFile;
      else if (trait.fill1File) imgSrc = basePath + '/' + trait.fill1File;
      else if (trait.outlineFile) imgSrc = basePath + '/' + trait.outlineFile;
      else if (trait.layers && trait.layers[0]) imgSrc = basePath + '/' + trait.layers[0].file;
      else if (trait.layer0File) imgSrc = basePath + '/' + trait.layer0File;

      allResults.push({
        category: metaCategory + ' (G2)',
        imgSrc,
        imgType: 'g2',
        rawKey,
        metaName: resolved.value,
        status: resolved.source,
        layerKey,
        g2Id: trait.id,
      });
    }
  } catch (e) {
    console.error('Failed to load G2 manifest:', e);
  }
}

function processSolidColors() {
  for (const [hex, name] of Object.entries(BACKGROUND_COLOR_NAMES)) {
    allResults.push({
      category: 'Background (Solid Colors)',
      imgSrc: null,
      imgType: 'color',
      colorHex: hex,
      rawKey: hex,
      metaName: name,
      status: 'map',
      layerKey: 'Background',
    });
  }
}

function renderStats() {
  const total = allResults.length;
  const mapped = allResults.filter(r => r.status === 'map').length;
  const overrides = allResults.filter(r => r.status === 'override').length;
  const fallbacks = allResults.filter(r => r.status === 'fallback').length;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="stat-value">${total}</span><span class="stat-label">Total entries</span></div>
    <div class="stat"><span class="stat-value ok">${mapped}</span><span class="stat-label">Mapped</span></div>
    <div class="stat"><span class="stat-value warn">${overrides}</span><span class="stat-label">Overrides</span></div>
    <div class="stat"><span class="stat-value ${fallbacks > 0 ? 'error' : 'ok'}">${fallbacks}</span><span class="stat-label">Fallback (review!)</span></div>
  `;
}

function renderFilters() {
  const categories = [...new Set(allResults.map(r => r.category))];
  const bar = document.getElementById('filterBar');

  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.textContent = 'All';
  allBtn.dataset.filter = 'all';
  bar.appendChild(allBtn);

  const issueBtn = document.createElement('button');
  issueBtn.className = 'filter-btn';
  issueBtn.textContent = 'Issues Only';
  issueBtn.dataset.filter = 'issues';
  bar.appendChild(issueBtn);

  for (const cat of categories) {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = cat;
    btn.dataset.filter = cat;
    bar.appendChild(btn);
  }

  bar.addEventListener('click', (e) => {
    if (!e.target.classList.contains('filter-btn')) return;
    bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    renderContent(e.target.dataset.filter);
  });
}

function renderContent(filter) {
  const container = document.getElementById('content');
  container.innerHTML = '';

  let filtered = allResults;
  if (filter === 'issues') {
    filtered = allResults.filter(r => r.status === 'fallback');
  } else if (filter !== 'all') {
    filtered = allResults.filter(r => r.category === filter);
  }

  // Group by category
  const grouped = {};
  for (const r of filtered) {
    if (!grouped[r.category]) grouped[r.category] = [];
    grouped[r.category].push(r);
  }

  for (const [category, items] of Object.entries(grouped)) {
    const section = document.createElement('div');
    section.className = 'category';

    const fallbackCount = items.filter(i => i.status === 'fallback').length;
    const uniqueNames = [...new Set(items.map(i => i.metaName))];

    section.innerHTML = `
      <div class="category-header">
        ${category}
        <span class="category-badge">${items.length} files</span>
        <span class="category-badge">${uniqueNames.length} unique traits</span>
        ${fallbackCount > 0 ? `<span class="category-badge" style="background:rgba(239,68,68,0.15);color:#ef4444">${fallbackCount} unmapped</span>` : ''}
      </div>
      <div class="category-source">Layer key: ${items[0].layerKey} | Source: ${items[0].imgType.toUpperCase()}</div>
    `;

    const grid = document.createElement('div');
    grid.className = 'trait-grid';

    for (const item of items) {
      const card = document.createElement('div');
      card.className = 'trait-card' + (item.status === 'fallback' ? ' fallback' : '');

      let imgHtml;
      if (item.imgType === 'color') {
        const textColor = isLightColor(item.colorHex) ? 'rgba(0,0,0,0.7)' : 'rgba(255,255,255,0.7)';
        imgHtml = `<div class="color-swatch" style="background:${item.colorHex}"><span style="color:${textColor}">${item.colorHex}</span></div>`;
      } else {
        imgHtml = `
          <div class="trait-img-wrap">
            <img src="${item.imgSrc}" alt="${item.metaName}" loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
            <div class="img-error" style="display:none">Image not found</div>
            <span class="trait-source-tag ${item.imgType}">${item.imgType}</span>
          </div>`;
      }

      let statusHtml;
      if (item.status === 'map') statusHtml = '<span class="trait-status mapped">Mapped</span>';
      else if (item.status === 'override') statusHtml = '<span class="trait-status override">Override</span>';
      else statusHtml = '<span class="trait-status fallback-status">FALLBACK</span>';

      card.innerHTML = `
        ${imgHtml}
        <div class="trait-info">
          <div class="trait-meta-name ${item.status === 'fallback' ? 'fallback-name' : ''}">${item.metaName}</div>
          <div class="trait-raw-key">key: "${item.rawKey}"${item.g2Id ? ` | id: ${item.g2Id}` : ''}</div>
          ${statusHtml}
        </div>
      `;
      grid.appendChild(card);
    }

    section.appendChild(grid);
    container.appendChild(section);
  }
}

function isLightColor(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 128;
}

// ============================================================
// Init
// ============================================================
async function init() {
  processG1();
  await processG2();
  processSolidColors();
  renderStats();
  renderFilters();
  renderContent('all');
}

init();
</script>
